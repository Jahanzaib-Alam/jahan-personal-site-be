services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: local-db
      POSTGRES_USER: local-user
      POSTGRES_PASSWORD: local-password
    ports:
      - "5432:5432"
    volumes:
      - personal-site-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local-user -d local-db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  personal-site-postgres:
