info:
  name: Get Current Prayer Times
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/prayer-times/current/{{mosqueId}}"
  auth: inherit

runtime:
  variables:
    - name: mosqueId
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
