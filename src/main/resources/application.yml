allowed:
  origins: ${ALLOWED_ORIGINS:https://jahanzaib.org, https://www.jahanzaib.org}

resilience4j.ratelimiter:
  # limit-for-period: maximum number of requests allowed within a specific time window
  # limit-refresh-period: duration of the time window after which the request counter resets back to zero
  # timeout-duration: how long a thread will wait/block for a permission/token to become available if the rate limit has already been exceeded.
  # -  Set to 0 to immediately return RequestNotPermitted error
  instances:
    steamApiLimiter:
      limit-for-period: ${STEAM_RATE_LIMIT_LIMIT_FOR_PERIOD:5}
      limit-refresh-period: ${STEAM_RATE_LIMIT_REFRESH_PERIOD:1m}
      timeout-duration: ${STEAM_RATE_LIMIT_TIMEOUT_DURATION:0}
    prayerTimesApiLimiter:
      limit-for-period: ${PRAYER_TIMES_RATE_LIMIT_LIMIT_FOR_PERIOD:500}
      limit-refresh-period: ${PRAYER_TIMES_RATE_LIMIT_REFRESH_PERIOD:1m}
      timeout-duration: ${PRAYER_TIMES_RATE_LIMIT_TIMEOUT_DURATION:0}

steam:
  api-key: ${STEAM_API_KEY}
  user-id: ${STEAM_USER_ID}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/production
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: jahan_personal_site
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: jahan_personal_site

logging:
  sns:
    arn: ${LOGGING_SNS_ARN:}
    region: ${LOGGING_SNS_REGION:eu-west-1}
    max-message-length: ${LOGGING_SNS_MAX_MESSAGE_LENGTH:8000}